<!--
  ═══════════════════════════════════════════════════════
  FAVICON FIX — Sand Dunes Stay
  Ye lines apne index.html ke <head> section mein add karo
  Jahan bhi <link rel="canonical"...> ya <meta name="..."> hai
  uske BAAD aur </head> se PEHLE paste karo
  ═══════════════════════════════════════════════════════
-->

<!-- Standard favicon (Google Search ke liye sabse important) -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<!-- PNG favicons (modern browsers ke liye) -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<!-- Apple devices ke liye -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<!-- Backup - original PNG (agar upar waale nahi milte) -->
<link rel="shortcut icon" type="image/png" href="/favicon.png">


<!--
  ═══════════════════════════════════════════════════════
  GITHUB PE KYA UPLOAD KARNA HAI:
  
  Ye 4 files GitHub repository ke ROOT folder mein upload karo:
    1. favicon.ico          ← sabse important
    2. favicon-32x32.png
    3. favicon-16x16.png
    4. apple-touch-icon.png
  
  favicon.png pehle se hai — use mat hatao.
  
  BAAD MEIN:
  - index.html aur sabhi .html files mein upar wale
    <link> tags <head> section mein add karo
  - GitHub Pages deploy hone ke baad Google Search Console mein
    "Request Indexing" karo
  - Google favicon update hone mein 1-4 hafte lag sakte hain
  ═══════════════════════════════════════════════════════
-->
